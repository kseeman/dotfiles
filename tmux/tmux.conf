# -----------------------------------------------------------------------------
# tmux configuration
# -----------------------------------------------------------------------------
#
# Shared across macOS and Linux. Anything platform-specific — currently just
# clipboard integration — lives in os/<os>/tmux.conf, linked to os.conf and
# sourced at the bottom of this file.
#
# The prefix is deliberately left at the default C-b: every tutorial and
# cheatsheet assumes it, and it works unchanged on any machine you SSH into.
#
# Help, from inside tmux:
#
#   C-b ?      cheatsheet, grouped by task (tmux/cheatsheet.txt)
#   C-b /      fuzzy-search every binding by key or description
#
# Every custom binding below carries a -N note, which is what makes it show up
# in the search. A binding without one is invisible there.

# -----------------------------------------------------------------------------
# Terminal and colors
# -----------------------------------------------------------------------------

# tmux advertises itself as this to programs running inside it. The -256color
# variant is what makes nvim's colors correct.
set -g default-terminal "tmux-256color"

# Pass true colour (24-bit) through from the outer terminal. Without this,
# colorschemes in nvim are quantised to 256 colours and look muddy.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"

# Let modified keys (ctrl+enter, ctrl+shift+letter, …) reach programs in the
# pane instead of being flattened to their unmodified form. Two halves:
#
#   extkeys       marks the outer terminal as able to *report* modified keys,
#                 so tmux asks it to start doing so.
#   extended-keys tells tmux to *forward* them to the program in the pane.
#
# "on" forwards only to programs that ask for them, so anything older keeps
# seeing plain keys. csi-u is the modern encoding (ESC [ 13 ; 2 u) rather than
# tmux's older xterm one (ESC [ 27 ; 2 ; 13 ~); nvim reads both.
#
# Note this is NOT what makes shift+enter work in Claude Code. Kitty does not
# take part in the modifyOtherKeys negotiation this enables, so shift+enter is
# handled terminal-side instead, by a send_text binding in kitty.conf. Keep
# these two facts apart when debugging: this block buys nvim keybindings, not
# shift+enter.
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys on
set -s extended-keys-format csi-u

# -----------------------------------------------------------------------------
# General behaviour
# -----------------------------------------------------------------------------

# How long tmux waits to see if an Escape is part of a longer key sequence.
# The default (500ms) makes Esc feel broken in nvim. This is the single most
# important setting here for a Vim user.
set -sg escape-time 10

# Let programs inside tmux know when the terminal gains/loses focus, so nvim's
# autoread picks up files changed outside the editor.
set -g focus-events on

# Default is 2000 lines, which is not much when a build or test run scrolls by.
set -g history-limit 50000

# Mouse: click panes/windows to select, drag borders to resize, wheel to scroll.
# Worth having on while learning — it makes the pane model visible.
set -g mouse on

# Windows and panes count from 1. The 0 key is a long reach for the first
# window, and this matches how the keyboard is laid out.
set -g base-index 1
setw -g pane-base-index 1

# Closing a window renumbers the rest, so there are never gaps like 1,2,5.
set -g renumber-windows on

# Let programs set the terminal title.
set -g set-titles on

# -----------------------------------------------------------------------------
# Reload
# -----------------------------------------------------------------------------

# Applies changes to this file without killing the server. The first binding
# you should learn, since it makes every other change cheap to try.
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# -----------------------------------------------------------------------------
# Splits
# -----------------------------------------------------------------------------

# The default keys are % and ". These are mnemonic instead: | looks like a
# vertical divider, - like a horizontal one. -c keeps the new pane in the same
# directory as the current one, which the defaults do not do.
bind -N "Split left/right" | split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom" - split-window -v -c "#{pane_current_path}"

# The originals are unbound so there's one way to do it while the habit forms.
unbind '"'
unbind %

# New windows also open in the current directory.
bind -N "New window" c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Pane navigation
# -----------------------------------------------------------------------------

# Vim directions. Matches how you already move in nvim.
bind -N "Move to pane left" h select-pane -L
bind -N "Move to pane below" j select-pane -D
bind -N "Move to pane above" k select-pane -U
bind -N "Move to pane right" l select-pane -R

# Resize with shift. -r means "repeatable": hold the prefix once, then press
# H/J/K/L several times without repeating C-b.
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# -----------------------------------------------------------------------------
# Copy mode
# -----------------------------------------------------------------------------

# Vim keys while scrolling back through output.
setw -g mode-keys vi

# v starts a selection and y yanks it, as in Vim. The actual clipboard command
# is OS-specific and bound in os.conf, sourced at the bottom.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Let the terminal put the selection on the system clipboard via OSC 52. Kitty
# supports this, and it keeps copy working over SSH where no local clipboard
# command exists.
set -g set-clipboard on

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5

# Left: session name. Right: host and time.
set -g status-left "#[bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#h  %H:%M "
set -g status-right-length 40

# Formats say *what* is shown; styles below say how it looks. Keeping them
# separate is what lets wallbash.conf recolour the bar without touching layout.
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Fallback styling using the terminal's own palette. On Linux with a HyDE theme
# active, wallbash.conf overrides all of these with colours derived from the
# wallpaper; everywhere else these plain defaults stand.
setw -g window-status-current-style "reverse,bold"
set -g pane-active-border-style "fg=colour4"
set -g mode-style "reverse"

# -----------------------------------------------------------------------------
# Sessions
# -----------------------------------------------------------------------------

# The session tree is the built-in prefix + s, which tmux zooms to fill the pane
# by default as of 3.7. Nothing to bind here.

# Fuzzy-find a project and open (or switch to) a session named after it. The
# script is also on PATH, so it works from a plain shell too.
bind -N "Find a project and switch to its session" f run-shell "tmux neww ~/.dotfiles/tmux/scripts/tmux-sessionizer"

# Jump back to the previously used session. This replaces the default
# next-layout binding, which is reachable as prefix + M-1..M-5 instead.
bind -N "Switch to last session" Space switch-client -l

# -----------------------------------------------------------------------------
# Help
# -----------------------------------------------------------------------------

# A hand-written cheatsheet, grouped by task, in a floating popup. q closes it.
# This replaces the default ?, which lists the same bindings ungrouped; the
# search below covers that. -E closes the popup when less exits.
bind -N "Show the cheatsheet" ? display-popup -E -w 80% -h 80% "less ~/.dotfiles/tmux/cheatsheet.txt"

# Fuzzy-search every binding that has a -N note, by key or by description. Esc
# or Enter closes it. This replaces the default /, which describes one key; the
# search finds a key just as well.
bind -N "Search key bindings" / display-popup -E -w 80% -h 80% "tmux list-keys -N | fzf --prompt 'key> '"

# -----------------------------------------------------------------------------
# Generated and platform-specific configuration
# -----------------------------------------------------------------------------

# Colours generated from the current wallpaper by HyDE's wallbash. Linux only,
# and regenerated on every theme or wallpaper change. -q so its absence is not
# an error.
source-file -q ~/.config/tmux/wallbash.conf

# Linked from os/<os>/tmux.conf by install.sh. Sourced after the shared config
# because a bind replaces any earlier one, so the OS clipboard binding wins.
source-file -q ~/.config/tmux/os.conf

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
#
# Managed by tpm, which install.sh clones. Keep plugins here under XDG rather
# than the legacy ~/.tmux/plugins.
#
#   prefix + I    install plugins declared below
#   prefix + U    update them
#   prefix + alt-u  remove ones no longer declared
#
# tmux-resurrect saves and restores sessions explicitly; tmux-continuum drives
# resurrect automatically on a timer and restores on server start.
#
# TMUX_PLUGIN_MANAGER_PATH is deliberately not set here: tpm already defaults to
# <xdg>/tmux/plugins when it finds tmux.conf under XDG, which is this setup.
# Setting it explicitly would also be broken, since tmux does not expand ~ in
# set-environment and the literal tilde path would not resolve.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore what was on screen, not just the pane layout.
set -g @resurrect-capture-pane-contents 'on'

# Save every 15 minutes and restore automatically when the server starts, so a
# reboot is not a lost workspace. Turn @continuum-restore off if you would
# rather start clean and restore by hand with prefix + C-r.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Must stay the last line: tpm reads everything declared above it.
run '~/.config/tmux/plugins/tpm/tpm'
