# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------

font_family      CaskaydiaCove Nerd Font Mono
# 9.0 rather than a more usual 14, because these are large displays at scale 1
# -- 5120x1440 and 3840x2160 -- where a point is physically small. This is the
# value the machine was actually being read at for months; 14 sat in this file
# untouched the whole time, because the installer skipped linking kitty while
# HyDE owned ~/.config/kitty, and only became live when that skip was removed.
#
# That is the Linux size. A Mac's displays are smaller, and 9 reads as tiny
# there, so os-macos.conf overrides it. kitty sets KITTY_OS itself and expands
# it inside an include path; a platform with no file is a warning kitty ignores.
#
# Through ~/.dotfiles rather than relative to this file: a relative include
# resolves in ~/.config/kitty, where only kitty.conf and theme.conf are linked.
font_size        9.0
include ${HOME}/.dotfiles/kitty/os-${KITTY_OS}.conf


# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------

window_padding_width 20

enable_audio_bell no

cursor_trail 1


# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------

repaint_delay 10
input_delay 3
sync_to_monitor yes


# -----------------------------------------------------------------------------
# Keyboard
# -----------------------------------------------------------------------------

# Shift+Enter inside tmux, which is what lets Claude Code take a newline there.
#
# tmux asks the outer terminal for modified keys with xterm's modifyOtherKeys,
# which kitty does not implement, so kitty sends tmux a plain Enter and the
# shift is gone before tmux sees it. This sends the CSI-u form tmux parses as
# S-Enter. tmux then forwards it only to programs that asked for extended keys
# (Claude Code and nvim do) and gives everything else a plain Enter, as before.
#
# Deliberately not ESC+CR, the usual recipe: a leading escape leaves insert
# mode in anything with vim bindings, Claude Code's prompt included.
#
# Only when the window is running tmux. Outside it, programs talk to kitty
# directly and get Shift+Enter through kitty's own keyboard protocol, while a
# program using neither -- a plain zsh prompt -- would print the sequence.
map --when-focus-on cmdline:^tmux shift+enter send_text all \x1b[13;2u


# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

include theme.conf

# The desktop's palette, on Linux. Generated by the desktop repo
# (kseeman/desktop) and included last, so it overrides the
# chrome above while the sixteen ANSI colours in theme.conf stand everywhere --
# those need to be distinguishable from each other, which a single-hue ramp
# cannot provide.
#
# A missing include is a warning kitty ignores, so macOS and any machine
# without the desktop simply keep theme.conf.
#
# **One line, unlike tmux's two.** kitty treats a file included twice as a
# configuration *error* and shows a dialog at every launch, so the trick that
# works there -- name both the default and the XDG location and let the second
# win -- is not available here. kitty also cannot express ${VAR:-default}, and
# globinclude rejects absolute paths.
#
# So this names $HOME, and the desktop writes kitty's file to exactly that
# path rather than to $THEME_DIR. The one output that does not follow
# XDG_CACHE_HOME, because the program reading it cannot be told how.
include ${HOME}/.cache/dotfiles/theme/kitty.conf

# Machine-local settings, last so they outrank everything above. The same hook
# ~/.config/dotfiles/zsh/local.zsh and nvim/local.lua give their tools, and the
# right home for anything that describes one machine rather than this setup: a
# background image and its tint, a font size for a particular display, a
# keybinding for a particular keyboard.
#
# A missing include is a warning kitty ignores, so a machine without one is
# not an error. $HOME rather than ${XDG_CONFIG_HOME} for the same reason as
# above -- kitty cannot express a default, and naming both would be the
# duplicate-include error again.
include ${HOME}/.config/dotfiles/kitty/local.conf
