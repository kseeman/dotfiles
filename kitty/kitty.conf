# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------

font_family      CaskaydiaCove Nerd Font Mono
font_size        14.0


# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------

window_padding_width 20

enable_audio_bell no

cursor_trail 1


# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------

repaint_delay 10
input_delay 3
sync_to_monitor yes


# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

include theme.conf
