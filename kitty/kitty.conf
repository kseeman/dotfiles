# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------

font_family      CaskaydiaCove Nerd Font Mono
font_size        14.0


# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------

window_padding_width 20

enable_audio_bell no

cursor_trail 1


# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------

repaint_delay 10
input_delay 3
sync_to_monitor yes


# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

include theme.conf

# The desktop's palette, on Linux. Generated by
# os/linux/desktop/render-theme.lua and included last, so it overrides the
# chrome above while the sixteen ANSI colours in theme.conf stand everywhere --
# those need to be distinguishable from each other, which a single-hue ramp
# cannot provide.
#
# A missing include is a warning kitty ignores, so macOS and any machine
# without the desktop simply keep theme.conf.
#
# **One line, unlike tmux's two.** kitty treats a file included twice as a
# configuration *error* and shows a dialog at every launch, so the trick that
# works there -- name both the default and the XDG location and let the second
# win -- is not available here. kitty also cannot express ${VAR:-default}, and
# globinclude rejects absolute paths.
#
# So this names $HOME, and render-theme.lua writes kitty's file to exactly that
# path rather than to $THEME_DIR. The one output that does not follow
# XDG_CACHE_HOME, because the program reading it cannot be told how.
include ${HOME}/.cache/dotfiles/theme/kitty.conf
