# Idle behaviour for the Lua desktop session.
#
# Its own file rather than ~/.config/hypr/hypridle.conf, which HyDE owns and
# which calls `hyde-shell lockscreen.sh` -- so it stops working the moment HyDE
# is removed. hypridle is started with -c pointing here.
#
# HyDE's version also dims the backlight at 120s. There is no backlight on this
# machine; brightnessctl's only device is a scroll-lock LED, so that listener
# would blink a keyboard light and nothing else. It is left out rather than
# ported.

general {
    # loginctl lock-session reaches this, which is what makes the lock work
    # from a menu, a systemd inhibitor, or the lid on a machine that has one.
    lock_cmd = pidof hyprlock || hyprlock -c $HOME/.dotfiles/os/linux/desktop/hyprlock.conf
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on

    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# pidof above matters: without it, a second hyprlock starts on top of the first
# and the session needs both dismissed.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Displays off well after the lock, not with it -- a screen that blanks at the
# same moment it locks looks like the machine died.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
