# -----------------------------------------------------------------------------
# tmux: Linux
# -----------------------------------------------------------------------------
#
# Linked to ~/.config/tmux/os.conf by os/linux/install.sh and sourced at the
# bottom of the shared tmux/tmux.conf.

# -----------------------------------------------------------------------------
# Clipboard
# -----------------------------------------------------------------------------

# Wayland. wl-copy comes from wl-clipboard, which is already in pacman.txt as a
# dependency of the Hyprland setup.
#
# copy-pipe-and-cancel sends the selection to the command and leaves copy mode,
# matching the way y behaves in Vim.
if-shell 'command -v wl-copy >/dev/null' {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'
}

# X11 fallback, for a non-Wayland session.
if-shell '! command -v wl-copy >/dev/null && command -v xclip >/dev/null' {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
}
