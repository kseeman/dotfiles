# -----------------------------------------------------------------------------
# tmux: macOS
# -----------------------------------------------------------------------------
#
# Linked to ~/.config/tmux/os.conf by os/macos/install.sh and sourced at the
# bottom of the shared tmux/tmux.conf.

# -----------------------------------------------------------------------------
# Clipboard
# -----------------------------------------------------------------------------

# pbcopy ships with macOS, so no package is needed.
#
# copy-pipe-and-cancel sends the selection to the command and leaves copy mode,
# matching the way y behaves in Vim.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
